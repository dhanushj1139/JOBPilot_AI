services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      PORT: 4000
      DB_FILE: /data/jobpilot.db
      FRONTEND_ORIGIN: http://localhost:8080
      ML_SERVICE_URL: http://ml-service:8000
    volumes: [dbdata:/data]
    ports: ["4000:4000"]
    depends_on: [ml-service]
  ml-service:
    build: ./ml-service
    ports: ["8000:8000"]
  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [backend]
volumes:
  dbdata:
