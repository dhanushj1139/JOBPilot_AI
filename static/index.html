<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JobHunter AI</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#667085;--ac:#2563eb;--bd:#e4e7ec}
@media(prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#181c22;--tx:#e8eaee;--mut:#98a2b3;--bd:#2a313a}}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--tx)}
.wrap{max-width:980px;margin:0 auto;padding:16px}.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:14px}
input,button,select{font:inherit;padding:9px 11px;border-radius:7px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
button{background:var(--ac);color:#fff;border:0;cursor:pointer}button.s{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.row>input{flex:1;min-width:150px}
.tag{display:inline-block;background:#2563eb22;color:var(--ac);padding:2px 9px;border-radius:99px;margin:2px;font-size:13px;cursor:default}
.tag b{cursor:pointer;margin-left:4px}.mut{color:var(--mut);font-size:13px}.job h3{margin:0 0 2px;font-size:16px}
.score{float:right;font-weight:600;color:#16a34a}.src{background:var(--bd);padding:1px 8px;border-radius:5px;font-size:12px}
header{display:flex;justify-content:space-between;align-items:center}#bell{position:relative;cursor:pointer}
#cnt{background:#dc2626;color:#fff;border-radius:99px;padding:0 6px;font-size:12px}#nl{display:none}
h2{font-size:17px;margin:0 0 10px}.hide{display:none}.ex{white-space:pre-wrap;background:var(--bg);padding:8px;border-radius:7px;margin-top:6px}
</style></head><body><div class="wrap">
<div id="auth" class="card" style="max-width:380px;margin:60px auto"><h2>JobHunter AI – sign in</h2>
<div class="row"><input id="em" placeholder="Email"></div><div class="row"><input id="pw" type="password" placeholder="Password"></div>
<div class="row"><button onclick="auth('login')">Login</button><button class="s" onclick="auth('register')">Register</button></div><div id="aerr" class="mut"></div></div>

<div id="app" class="hide">
<header><h1 style="margin:0">JobHunter AI</h1><div><span id="bell" onclick="toggleN()">🔔 <span id="cnt">0</span></span> <button class="s" onclick="logout()">Logout</button></div></header>
<div id="nl" class="card"></div>
<div class="card"><h2>1. Your details & resume</h2>
<div class="row"><input id="name" placeholder="Full name"><input id="phone" placeholder="Phone"><input id="loc" placeholder="Preferred location"></div>
<div class="row"><input id="title" placeholder="Job title you want (e.g. Python Developer)"><input type="file" id="file" accept=".pdf,.docx,.txt"></div>
<button onclick="saveProfile()">Save & extract skills</button> <span id="pmsg" class="mut"></span>
<h2 style="margin-top:14px">Extracted skills <span class="mut">(click × to remove, add your own)</span></h2><div id="skills"></div>
<div class="row"><input id="ns" placeholder="Add a skill"><button class="s" onclick="addSkill()">Add</button></div></div>

<div class="card"><h2>2. Job portal logins <span class="mut">(stored encrypted)</span></h2>
<div class="row"><select id="pp"><option>naukri</option><option>linkedin</option><option>indeed</option><option>glassdoor</option><option>foundit</option></select>
<input id="pu" placeholder="Username / email"><input id="ppw" type="password" placeholder="Password"><button class="s" onclick="addPortal()">Save</button></div>
<div id="portals" class="mut"></div></div>

<div class="card"><h2>3. Matching jobs</h2>
<div class="row"><button onclick="refresh()">🔍 Search all portals now</button>
<input id="fl" placeholder="Location filter (e.g. Hyderabad, Bangalore)" style="flex:1;min-width:200px" onchange="loadJobs()">
<label class="mut"><input type="checkbox" id="rm" checked onchange="loadJobs()"> include remote</label>
<select id="srt" onchange="loadJobs()"><option value="recent">Newest first</option><option value="match">Best match first</option></select>
<select id="dys" onchange="loadJobs()"><option value="0">Any date</option><option value="1">Last 24 hours</option><option value="7">Last 7 days</option><option value="30">Last 30 days</option></select>
<select id="minS" onchange="loadJobs()"><option value="0">All scores</option><option value="30">30%+</option><option value="50">50%+</option><option value="70">70%+</option></select>
<span id="jmsg" class="mut"></span></div><div id="jobs"></div></div></div></div>
<script>
let T=localStorage.t||"",SK=[];const $=i=>document.getElementById(i);
async function api(p,o={}){o.headers=Object.assign({Authorization:"Bearer "+T},o.headers||{});const r=await fetch("/api"+p,o);
 if(r.status==401){logout();throw 0}const j=await r.json();if(!r.ok)throw new Error(j.detail);return j}
async function auth(k){try{const r=await fetch("/api/"+k,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:$("em").value,password:$("pw").value})});
 const j=await r.json();if(!r.ok)throw new Error(j.detail);T=localStorage.t=j.token;init()}catch(e){$("aerr").textContent=e.message}}
function logout(){localStorage.t="";T="";$("app").classList.add("hide");$("auth").classList.remove("hide")}
async function init(){if(!T)return;try{const p=await api("/profile");$("auth").classList.add("hide");$("app").classList.remove("hide");
 $("name").value=p.name||"";$("phone").value=p.phone||"";$("loc").value=p.location||"";if(!$("fl").value)$("fl").value=p.location||"";$("title").value=p.job_title||"";
 SK=p.skills;drawSkills();$("portals").innerHTML=p.portals.map(x=>`<span class="tag">${x}<b onclick="delPortal('${x}')">×</b></span>`).join("");
 loadJobs();loadN();if("Notification"in window&&Notification.permission=="default")Notification.requestPermission()}catch(e){}}
function drawSkills(){$("skills").innerHTML=SK.map((s,i)=>`<span class="tag">${s}<b onclick="SK.splice(${i},1);putSkills()">×</b></span>`).join("")||'<span class="mut">Upload a resume to extract skills</span>'}
async function putSkills(){await api("/skills",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({skills:SK})});drawSkills();loadJobs()}
function addSkill(){const v=$("ns").value.trim().toLowerCase();if(v){SK.push(v);$("ns").value="";putSkills()}}
async function saveProfile(){const f=new FormData();f.append("name",$("name").value);f.append("phone",$("phone").value);f.append("location",$("loc").value);f.append("job_title",$("title").value);
 if($("file").files[0])f.append("resume",$("file").files[0]);$("pmsg").textContent="Saving…";
 try{const p=await api("/profile",{method:"POST",body:f});SK=p.skills;drawSkills();$("pmsg").textContent="Saved ✓";$("fl").value=$("loc").value;loadJobs()}catch(e){$("pmsg").textContent=e.message}}
async function addPortal(){await api("/portals",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({portal:$("pp").value,username:$("pu").value,password:$("ppw").value})});$("ppw").value="";init()}
async function delPortal(p){await api("/portals/"+p,{method:"DELETE"});init()}
async function refresh(){$("jmsg").textContent="Searching portals… (can take ~30s)";try{const r=await api("/refresh",{method:"POST"});$("jmsg").textContent=r.new_jobs+" new jobs found";loadJobs();loadN()}catch(e){$("jmsg").textContent=e.message}}
function ago(t){const s=Date.now()/1000-t;if(s<3600)return Math.max(1,Math.round(s/60))+" min ago";if(s<86400)return Math.round(s/3600)+" hours ago";const d=Math.round(s/86400);return d==1?"1 day ago":d+" days ago"}
async function loadJobs(){const j=await api("/jobs?min_score="+$("minS").value+"&location="+encodeURIComponent($("fl").value)+"&remote="+($("rm").checked?1:0)+"&sort="+$("srt").value+"&days="+$("dys").value);
 $("jobs").innerHTML=j.map(x=>`<div class="card job"><span class="score">${x.score}% match</span><h3>${x.title}</h3>
 <div class="mut">${x.company} · ${x.location||""} · <span class="src">Found on ${x.source}</span> · 🕒 ${ago(x.ts)}</div>
 <div style="margin:6px 0">${x.matched_skills.map(s=>`<span class="tag">${s}</span>`).join("")}</div>
 <div class="mut">${x.snippet}…</div><div class="row" style="margin-top:8px"><a href="${x.url}" target="_blank"><button>Apply / view ↗</button></a>
 <button class="s" onclick="why('${x.id}',this)">Why this match?</button></div><div class="ex hide"></div></div>`).join("")||'<div class="mut">No jobs yet – save your profile, then click “Search all portals now”.</div>'}
async function why(id,b){const d=b.parentElement.nextElementSibling;d.classList.remove("hide");d.textContent="Thinking…";d.textContent=(await api("/jobs/"+id+"/explain")).text}
let lastN=0;async function loadN(){const n=await api("/notifications");const un=n.filter(x=>!x.seen);$("cnt").textContent=un.length;
 $("nl").innerHTML="<h2>New job alerts</h2>"+(n.map(x=>`<div style="margin:6px 0;${x.seen?'opacity:.6':''}"><a href="${x.url}" target="_blank">${x.title}</a> – ${x.company} <span class="src">${x.source}</span> <b>${x.score}%</b></div>`).join("")||"No alerts yet");
 if(un.length>lastN&&lastN!==0&&"Notification"in window&&Notification.permission=="granted")new Notification("New job matches",{body:un[0].title+" – "+un[0].company});lastN=un.length}
async function toggleN(){const e=$("nl");e.style.display=e.style.display=="block"?"none":"block";if(e.style.display=="block"){await api("/notifications/seen",{method:"POST"});setTimeout(loadN,500)}}
setInterval(()=>{if(T)loadN().catch(()=>{})},60000);init();
</script></body></html>
